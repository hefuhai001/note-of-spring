spring:
  application:
    name: spring-skills
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

skills:
  base-path: classpath:/skills/
  auto-discovery: true
  prompt-file-name: prompt.md
  metadata-file-name: skill.yaml

logging:
  level:
    com.hfh.api: debug
    org.springframework.ai: info
