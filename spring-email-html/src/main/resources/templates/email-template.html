<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邮箱验证码</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: grid;
            place-items: center;
            height: 100vh;
            width: 100vw;
        }

        .container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 90vw;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        #verificationCode {
            margin-bottom: 20px;
        }

        .button {
            background-color: #5c67f2;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .button:hover {
            background-color: #4a54e1;
        }

        #sign {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>尊敬的用户：您好！</h1>
    <p>您正在进行<span style="color: #f60;">注册账号</span>操作，请在验证码中输入以下验证码完成操作：</p>
    <div id="verificationCode">
        <button class="button" th:each="a, iterStat : ${text}" th:text="${a}"></button>
    </div>
    <p>
        注意：此操作可能会修改您的密码、登录邮箱或绑定手机。如非本人操作，请及时登录并修改密码以保证帐户安全（工作人员不会向你索取此验证码，请勿泄漏！)</p>
    <p id="sign">——超级帅哥</p>
</div>
</body>
</html>
