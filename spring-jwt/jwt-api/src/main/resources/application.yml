server:
  port: 9090

spring:
  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/db_spring?serverTimezone=GMT%2b8
    username: root
    password: ${DB_PASSWORD}

knife4j:
  enable: true
  setting:
    language: zh_cn

