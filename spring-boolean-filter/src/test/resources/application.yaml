spring:
  datasource:
    url: jdbc:mysql://localhost:3306/spring_bool_filter?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  session:
    store-type: none

# Redis 测试配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      password: ${DB_PASSWORD}
      timeout: 10s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
