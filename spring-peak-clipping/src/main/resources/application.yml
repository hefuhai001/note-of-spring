spring:
  application:
    name: spring-peak-clipping

  datasource:
    url: jdbc:postgresql://localhost:5432/db_activity
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ${DB_PASSWORD}
      database: 1
      timeout: 10000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

activity:
  cache:
    preload:
      enabled: true
      cron: "0 */5 * * * *"
    key-prefix: "activity:cache:"
    ttl-minutes: 60
