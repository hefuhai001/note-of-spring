info:
  app:
    name: Spring Cloud Demo
    version: 1.0.0
    description: 微服务学习示例项目

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.example: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

global:
  timeout: 5000
  max-retries: 3
  environment: development