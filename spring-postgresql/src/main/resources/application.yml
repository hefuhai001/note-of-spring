server:
  port: 9999
  tomcat:
    max-connections: 10000
    threads:
      max: 800
      min-spare: 100
    accept-count: 100
    connection-timeout: 20000


spring:
  application:
    name: spring-postgresql

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-date-keys-as-timestamps: false

  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 10MB
      file-size-threshold: 2KB
      location: /tmp
      resolve-lazily: false

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=600s

  task:
    execution:
      pool:
        core-size: 8
        max-size: 16
        queue-capacity: 100
        keep-alive: 60s
      thread-name-prefix: async-task-

    scheduling:
      pool:
        size: 4
      thread-name-prefix: scheduling-

  profiles:
    active: dev


mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.demo.entity


knife4j:
  enable: true
  production: false
  setting:
    language: zh_cn
    enable-footer-custom: true
    footer-custom-content: "Apache License 2.0 | Copyright xiao he like sleep"
  basic:
    enable: true
    username: 1
    password: ${DB_PASSWORD}


logging:
  file:
    name: app.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB
