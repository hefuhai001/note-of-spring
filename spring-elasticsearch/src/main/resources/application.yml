spring:
  # PostgreSQL ??
  datasource:
    url: jdbc:postgresql://localhost:5432/db_book
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA ??
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Elasticsearch ??
  elasticsearch:
    rest:
      uris: http://localhost:9200

logging:
  level:
    com.example.es: DEBUG