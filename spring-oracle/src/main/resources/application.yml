spring:
  application:
    name: spring-oracle
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/ORCL
    username: system
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    database-platform: org.hibernate.dialect.Oracle12cDialect
    hibernate:
      ddl-auto: update
    show-sql: true
